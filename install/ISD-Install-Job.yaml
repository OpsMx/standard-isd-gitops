apiVersion: batch/v1
kind: Job
metadata:
  name: isd-install
  labels:
    app: isd-install
    app.kubernetes.io/managed-by: spinnaker
    app.kubernetes.io/name: isd-install
spec:
  backoffLimit: 2
  completions: 1
  parallelism: 1
  template:
    spec:
      containers:
        - args:
            - |-

              for env in $( echo $envs | tr "," "\n" )
              do
              echo export $env >> /tmp/environment
              done
              for filename in /secret/*
              do
              variable=$(echo $filename | sed 's#/# #g' | awk '{print $2}')
              echo setting env $variable for $filename 
              echo "export $variable=$(cat "$filename")" >> /tmp/environment
              done

              source /tmp/environment >/dev/null 2>&1
              cd /repo/
              chmod +x /repo/install/isd-install.sh
              /repo/install/isd-install.sh
          command:
            - /bin/bash
            - +x
            - '-c'
          envFrom:
          - configMapRef:
              name: inputcm
          image: 'quay.io/opsmxpublic/helm-bash:v2'
          imagePullPolicy: IfNotPresent
          name: apply-yamls
          volumeMounts:
            - mountPath: /repo
              name: repo-volume
            - mountPath: /secret
              name: secret-volume
      initContainers:
        - args:
            - >-

              for secret in $(echo $secrets | sed "s/,/ /g")

              do

              echo getting $secret

              if ! kubectl -n "$namespace" get secret "$secret" >/dev/null 2>&1; then
              kubectl -n "$namespace" get secret "$secret"
                  echo "No secret $secret found, exiting"
                  exit 1
              fi

              kubectl -n "$namespace" get secret "$secret" -o jsonpath='{.data.*}' | base64 -d > /secret/"$secret" 

              ls -ltr /secret/"$secret"

              done

          command:
            - /bin/bash
            - +x
            - '-c'
          envFrom:
          - configMapRef:
              name: inputcm
          image: 'quay.io/opsmxpublic/opsmx-custom-binaries:kubectl-spin-cli-git-bash-jq-yq'
          imagePullPolicy: IfNotPresent
          name: get-secrets
          volumeMounts:
            - mountPath: /secret
              name: secret-volume
        - args:
            - >-

              ls -ltr /secret/gittoken || { echo "failed cloning $url" ; exit 1; }

              git clone https://"$username":"$(cat /secret/gittoken)"@"$url" -b "$branch" /repo

              if [ $? != 0 ] 

              then

                exit 1

              else

                ls -lrt /repo # Show the files cloned, as a success marker

              fi

          command:
            - /bin/sh
            - +x
            - '-c'
          envFrom:
          - configMapRef:
              name: inputcm
          image: 'quay.io/opsmxpublic/opsmx-custom-binaries:kubectl-spin-cli-git-bash-jq-yq'
          imagePullPolicy: IfNotPresent
          name: git-clone
          volumeMounts:
            - mountPath: /secret
              name: secret-volume
            - mountPath: /repo
              name: repo-volume
      serviceAccount: isd-install
      serviceAccountName: isd-install
      restartPolicy: "Never"
      volumes:
        - emptyDir: {}
          name: secret-volume
        - emptyDir: {}
          name: repo-volume
